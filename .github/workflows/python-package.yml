# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 removido: o código usa sintaxe PEP 604 (`str | None`) avaliada em tempo de
        # definição, sem `from __future__ import annotations` — em 3.9 é TypeError já no
        # import (ex.: core/scanner.py, core/html_monitor.py). O job nunca pôde passar.
        # 3.10 é a versão da imagem Docker (deploy/Dockerfile); 3.12 é a da venv local.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pip-audit bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # Reprova por erro de sintaxe ou nome indefinido.
        # ATENCAO: --select casa por PREFIXO. "F82" tambem captura F824 (`nonlocal` de nome
        # nunca reatribuido), que reprovou este passo em silencio quando o pyflakes 3.x
        # introduziu a regra. Como este passo vem ANTES do pytest e os passos sao
        # sequenciais, a suite deixou de rodar no CI sem ninguem notar. Corrigido no codigo
        # (core/scanner.py), nao afrouxando o filtro.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # Fecha a lacuna "analise estatica dedicada", ate aqui um GAP declarado. O flake8 acima
    # so pega erro de sintaxe e nome indefinido; o bandit procura padrao de risco
    # (shell=True, eval, bind aberto, except mudo, subprocess com entrada externa).
    #
    # REPROVA a build. As excecoes sao `# nosec BXXX` no ponto exato, com o motivo escrito
    # na linha acima — nominal e auditavel, em vez de um skip do teste inteiro no config.
    # Hoje sao 6, todas verificadas: 2 falsos positivos de B104 (a string "0.0.0.0" aparece
    # numa lista de BLOQUEIO e numa comparacao que AVISA sobre o bind), 3 de B311 (`random`
    # para jitter e rotacao de User-Agent, que sao camuflagem e nao criptografia) e 1 de
    # B404/B603 (`git log` com lista fixa de args, sem shell e sem entrada externa).
    # Os 3 achados REAIS (`except Exception: pass` mudo em extract_entry_media_urls) foram
    # corrigidos, nao suprimidos.
    - name: Static analysis (bandit)
      run: |
        bandit -r bot core utils web scripts main.py settings.py -q

    - name: Test with pytest
      run: |
        pytest
    # Fecha a lacuna "verificacao de dependencias vulneraveis", ate aqui um GAP declarado.
    #
    # REPROVA a build em qualquer vulnerabilidade nova. A unica excecao e nominal e
    # justificada abaixo — excecao com nome e data e auditavel; `continue-on-error` num
    # passo inteiro so ensina a ignorar o passo.
    #
    # PYSEC-2022-252 (deep-translator): registra o sequestro da conta do mantenedor no PyPI
    # em 2022, quando saiu uma release maliciosa que roubava variaveis de ambiente e baixava
    # malware EM TEMPO DE INSTALACAO. O aviso nao declara versao corrigida, entao casa com
    # qualquer versao — inclusive a 1.11.4, que e a mais recente publicada e ja e o piso do
    # requirements.txt. Verificado em 2026-08-29 no artefato instalado: e wheel pura
    # (poetry-core 1.6.1, Root-Is-Purelib), sem setup.py, sem arquivo .pth e sem
    # subprocess/os.system/eval/exec/os.environ no codigo do pacote — o vetor descrito no
    # aviso nao existe neste artefato. Reavaliar se o projeto publicar versao nova.
    - name: Audit dependencies (pip-audit)
      run: |
        pip-audit --requirement requirements.txt --strict --progress-spinner=off \
          --ignore-vuln PYSEC-2022-252
